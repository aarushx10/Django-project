{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
  <h4 class="mb-3">Create account</h4>
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
</div></div></div></div>
{% endblock %}
