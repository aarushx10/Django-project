{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
  <h4 class="mb-3">Log in</h4>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3"><label class="form-label">Username</label>
      <input name="username" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 small">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div></div></div></div>
{% endblock %}
