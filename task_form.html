{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card"><div class="card-body">
  <h4 class="mb-3">{% if object %}Edit task{% else %}New task{% endif %}</h4>
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% url 'task-list' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
